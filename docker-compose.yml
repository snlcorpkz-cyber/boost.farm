services:
  web:
    build:
      context: .
      target: frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    volumes:
      # Admin-uploaded offer icons. Shared read-only with the api
      # container which writes into the same volume. Must match the
      # path nginx looks at (server root + /assets/offers/).
      - offer_assets:/usr/share/nginx/html/assets/offers:ro
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    environment:
      - PORT=3001
      # Comma-separated allow-list of explicit CORS origins. The *boostfarm.io
      # family is also allowed implicitly by the regex in api/src/index.ts —
      # this env var is for non-production hosts (preview deploys, the
      # publisher's review domain, etc.). Keep `localhost:3000` so the Docker
      # build's own preview HTTP serving still works.
      - CLIENT_URL=http://localhost:3000,http://localhost:5173,https://boostfarm.io
    expose:
      - "3001"
    volumes:
      # Persist uploaded offer icons across api rebuilds and expose the
      # same directory to nginx via the shared named volume (see `web`).
      # Path matches UPLOAD_DIR in packages/api/src/routes/admin/offers.ts
      # (process.cwd() is /app under the node:20-alpine runtime).
      - offer_assets:/app/public/assets/offers
    restart: unless-stopped

volumes:
  offer_assets:
