# ---------------------------------------------------------------------------
# User-Agent based routing for the boostfarm.io root.
#
# The already-published Android app loads `https://boostfarm.io/` directly
# into its WebView (see apps/android/.../MainActivity.kt). We cannot move
# that URL without shipping a new Android release, so we keep the game SPA
# at `/` and split traffic here by User-Agent:
#
#   1) Android WebView    → UA always contains " wv)" (Chromium-based since
#                           Android 4.4; our minSdk is 26). Send to game.
#   2) In-app browsers of Facebook / Instagram / TikTok / etc. also set
#                           " wv)" — but they *also* stamp their app name.
#                           Detect and force those back to the landing so
#                           ad-click traffic from social always sees the
#                           marketing page + Play Store CTA.
#   3) Everything else (Chrome / Safari / Firefox / bots) → landing.
#
# Verified regex behaviour in scripts/test-ua-routing.mjs.
# ---------------------------------------------------------------------------
map $http_user_agent $is_android_webview {
    default        0;
    "~ wv\)"       1;
}

map $http_user_agent $is_social_iab {
    default                                                                                   0;
    "~FB_IAB|FBAN|Instagram|Pinterest|TikTok|musical_ly|Twitter|LinkedIn|Line\/|Snapchat|OKApp|VKAndroidApp"  1;
}

map "$is_android_webview:$is_social_iab" $entry_html {
    default      /landing/index.html;
    "1:0"        /index.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /partner/ {
        alias /usr/share/nginx/html/partner/;
        try_files $uri $uri/ /partner/index.html;
    }

    # Static assets for the landing page (images, etc.). Separate prefix so
    # it cannot collide with Vite's /assets/ bundle output below.
    location /landing/ {
        alias /usr/share/nginx/html/landing/;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Admin-uploaded offer icons. Lives on the `offer_assets` named
    # volume shared with the api container (see docker-compose.yml).
    # `try_files ... =404` is important here: without it, a missing
    # icon falls through to the SPA fallback below and returns
    # index.html with a 200, which breaks <img> silently. Filenames
    # are timestamp-based (offer-<unix-ms>.ext) so they're effectively
    # immutable per URL.
    location /assets/offers/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Hashed JS/CSS chunks produced by Vite for the game SPA.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Referral redirector (ReferralLandingPage.tsx). Must ALWAYS serve the
    # SPA, bypassing the UA-based landing split above — the whole point of
    # `/r/CODE` is that a friend who does NOT yet have the app (UA is a
    # regular Android Chrome, not a WebView) can click the link and get
    # auto-forwarded to the Play Store with `&referrer=ref%3DCODE`
    # attached. Without this explicit rule, the fallback below sends such
    # users to /landing/index.html, which has plain Play Store buttons
    # without the referrer param — so Install Referrer comes back empty
    # and the inviter is never credited. Works identically in WebView
    # (UA has " wv)"): the same SPA index.html loads and
    # ReferralLandingPage detects `window.EcoFarmAndroid` and routes to
    # /?ref=CODE in-app, so installed users see zero behavior change.
    location /r/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Root + SPA fallback. Existing static files (favicon, manifest, sw)
    # are served first; only if none match do we dispatch to either the
    # game SPA or the landing based on User-Agent.
    location = / {
        try_files $entry_html =404;
    }

    location / {
        try_files $uri $uri/ $entry_html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
