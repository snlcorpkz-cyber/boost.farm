# Android WebView signature — Chrome-based in-app browser always sets the
# literal `; wv)` marker in its User-Agent (e.g.
# "Mozilla/5.0 (Linux; Android 13; Pixel 7; wv) AppleWebKit/..."). Standalone
# Chrome / Samsung Internet / Firefox etc. never emit `wv)`, so we use this
# to split traffic: the published Android app keeps loading the game SPA at
# `/`, everyone else sees the static marketing landing page.
map $http_user_agent $entry_html {
    default       /landing/index.html;
    "~ wv\)"      /index.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /partner/ {
        alias /usr/share/nginx/html/partner/;
        try_files $uri $uri/ /partner/index.html;
    }

    # Static assets for the landing page (images, fonts). Kept under its own
    # prefix so it can't collide with Vite's /assets/ bundle output below.
    location /landing/ {
        alias /usr/share/nginx/html/landing/;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed JS/CSS chunks produced by Vite for the game SPA.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Root + SPA fallback:
    #   • Android WebView (UA contains `wv)`) -> game SPA (/index.html)
    #   • Regular browsers                    -> landing page
    # Existing static files are served first so favicon / manifest / etc.
    # are unaffected.
    location = / {
        try_files $entry_html =404;
    }

    location / {
        try_files $uri $uri/ $entry_html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
